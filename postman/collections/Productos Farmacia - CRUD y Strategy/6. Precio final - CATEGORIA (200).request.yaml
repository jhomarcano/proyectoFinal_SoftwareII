$kind: http-request
url: "{{baseUrl}}/api/productos/{{productoId}}/precio-final?estrategia=CATEGORIA"
method: GET
queryParams:
  estrategia: CATEGORIA
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Devuelve estrategia CATEGORIA', () => pm.expect(pm.response.json().estrategia).to.eql('CATEGORIA'));
    language: text/javascript
order: 6000
