$kind: http-request
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "",
      "principioActivo": "Paracetamol",
      "presentacion": "Caja x 20 tabletas",
      "lote": "L2026-045",
      "fechaVencimiento": "{{fechaLejana}}",
      "precio": -5,
      "stock": -1,
      "stockMinimo": 5,
      "requiereFormula": false,
      "categoria": "MEDICAMENTO",
      "activo": true
    }
scripts:
  - type: beforeRequest
    code: |-
      const d = new Date(); d.setDate(d.getDate() + 20);
      pm.variables.set('fechaProxima', d.toISOString().slice(0,10));
      const l = new Date(); l.setFullYear(l.getFullYear() + 1);
      pm.variables.set('fechaLejana', l.toISOString().slice(0,10));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Estado 400', () => pm.response.to.have.status(400));
      pm.test('Lista detalles de validación', () => pm.expect(pm.response.json().detalles.length).to.be.above(0));
    language: text/javascript
order: 8000
