spring.application.name=productos

# Por defecto apunta a PostgreSQL en el equipo (puerto 5433). Dentro de Docker
# se sobrescribe con las variables DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/productos_db}
spring.datasource.username=${DB_USER:productos_user}
spring.datasource.password=${DB_PASSWORD:productos_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
