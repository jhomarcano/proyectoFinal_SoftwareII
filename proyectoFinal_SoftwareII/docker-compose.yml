services:
  postgres:
    image: postgres:17
    container_name: productos-postgres
    environment:
      POSTGRES_DB: productos_db
      POSTGRES_USER: productos_user
      POSTGRES_PASSWORD: productos_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productos_user -d productos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplicación Spring Boot. Se levanta con: docker compose --profile app up --build
  app:
    build: .
    container_name: productos-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/productos_db
      DB_USER: productos_user
      DB_PASSWORD: productos_pass
    ports:
      - "8080:8080"

  sonarqube:
    image: sonarqube:community
    container_name: productos-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
